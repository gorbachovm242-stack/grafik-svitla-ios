# Збирання «Графіка світла» для iPhone без Mac: усе робить машина macOS на GitHub.
# Тека ios/ — корінь окремого репозиторію (див. README.md), тому workflow лежить у ios/.github/workflows/.
#
# test        — щоразу: тести логіки (swift test), збирання застосунку й віджета, тести на симуляторі iPhone,
#               картинки всіх віджетів (артефакт widget-previews). Підпис і секрети не потрібні.
# ipa         — після зелених тестів на main: непідписаний .ipa для сайдлоаду (AltStore, SideStore, Sideloadly)
#               у релізі «Для сайдлоаду» (tag sideload): його можна завантажити без входу на GitHub.
# testflight  — лише вручну (Actions → iOS → Run workflow → «testflight»): архів, підпис і надсилання в TestFlight.
#               Потрібні секрети ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID (README, крок 4).
name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Після тестів зібрати й надіслати в TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: GrafikSvitla.xcodeproj
  SCHEME: GrafikSvitla

jobs:
  test:
    name: Збирання й тести
    # Збірки для App Store мають бути з Xcode 26 і новіших. Якщо цієї мітки ще немає, спробуйте macos-latest.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Найновіший Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version

      - name: Проєкт із project.yml (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      - name: Тести логіки (SvitloCore)
        run: swift test --package-path SvitloCore

      - name: Симулятор iPhone
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = []
          for runtime, items in devices.items():
              if ".iOS-" not in runtime:
                  continue
              version = [int(x) for x in runtime.split(".iOS-")[1].split("-") if x.isdigit()]
              for d in items:
                  if d["name"].startswith("iPhone"):
                      found.append((version, d["udid"], d["name"]))
          found.sort()
          print(found[-1][1])
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Збирання й тести на симуляторі
        run: |
          mkdir -p build/previews
          set +e
          env TEST_RUNNER_PREVIEW_DIR="$PWD/build/previews" xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > build/xcodebuild.log 2>&1
          code=$?
          set -e
          grep -E "error:|\*\* (BUILD|TEST) |Test Case .*(passed|failed)|Executed [0-9]+ test" build/xcodebuild.log | tail -300 || true
          ls build/previews | head -100 || true
          exit $code

      - name: Картинки віджетів і журнал збирання
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: widget-previews
          path: |
            build/previews
            build/xcodebuild.log
          if-no-files-found: warn

  ipa:
    name: IPA для сайдлоаду
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write # реліз «Для сайдлоаду»
    steps:
      - uses: actions/checkout@v7

      - name: Найновіший Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Проєкт із project.yml (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Збирання для iPhone без підпису (Release)
        run: |
          mkdir -p build
          set +e
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/ipa-build.log 2>&1
          code=$?
          set -e
          grep -E "error:|\*\* BUILD" build/ipa-build.log | tail -50 || true
          exit $code

      # Інструмент сайдлоаду бере дозволи з підпису застосунку, тож App Group треба вписати: без неї віджет
      # не бачив би налаштувань. Підписуємо «ad-hoc» (без сертифіката) лише з App Group; справжній підпис
      # безкоштовним Apple ID робить уже AltStore чи Sideloadly (групу він може перейменувати — застосунок
      # знайде її сам, див. SvitloCore/AppGroupLookup.swift).
      - name: Дозволи, підпис ad-hoc і .ipa
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/GrafikSvitla.app
          GROUP=$(xcodebuild -showBuildSettings -project "$PROJECT" -target GrafikSvitla -configuration Release 2>/dev/null \
            | awk -F ' = ' '/^ *APP_GROUP_ID = /{print $2; exit}')
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          echo "App Group: $GROUP, версія: $VERSION"
          test -n "$GROUP"
          cat > build/entitlements.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.application-groups</key>
            <array><string>${GROUP}</string></array>
          </dict>
          </plist>
          EOF
          codesign --force --sign - --entitlements build/entitlements.plist "$APP/PlugIns/GrafikWidgets.appex"
          codesign --force --sign - --entitlements build/entitlements.plist "$APP"
          codesign -d --entitlements - "$APP/PlugIns/GrafikWidgets.appex" 2>&1 | tail -5
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          IPA="GrafikSvitla-${VERSION}-${{ github.run_number }}.ipa"
          (cd build/ipa && zip -qry "../$IPA" Payload)
          echo "IPA=build/$IPA" >> "$GITHUB_ENV"
          ls -la build/*.ipa
          unzip -l "build/$IPA" | grep -E "Info.plist$|GrafikSvitla$|GrafikWidgets$" | head || true

      - name: Файл .ipa (артефакт)
        uses: actions/upload-artifact@v7
        with:
          name: ipa-sideload
          path: ${{ env.IPA }}

      - name: Реліз «Для сайдлоаду» (остання збірка)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete sideload --yes --cleanup-tag 2>/dev/null || true
          gh release create sideload "$IPA" --target "$GITHUB_SHA" --prerelease \
            --title "Для сайдлоаду: остання збірка" \
            --notes "Непідписаний файл застосунку «Графік світла» для iPhone, щоб поставити без App Store: підпишіть його своїм безкоштовним Apple ID через AltStore, SideStore чи Sideloadly. Так підписаний застосунок працює 7 днів, потім його треба підписати знову (AltStore і SideStore роблять це самі). Збірка з коміту ${GITHUB_SHA::7}, запуск №${{ github.run_number }}."

  testflight:
    name: TestFlight
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Найновіший Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Проєкт із project.yml (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Ключ App Store Connect API
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Немає секретів ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 чи APPLE_TEAM_ID (README, крок 4)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Архів (Release, підпис через App Store Connect)
        run: |
          mkdir -p build
          set +e
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/GrafikSvitla.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            > build/archive.log 2>&1
          code=$?
          set -e
          grep -E "error:|\*\* ARCHIVE" build/archive.log | tail -100 || true
          exit $code

      - name: Надіслати в TestFlight
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/GrafikSvitla.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Журнал архіву
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: archive-log
          path: build/archive.log
          if-no-files-found: ignore

      - name: Прибрати ключ
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
