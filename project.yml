# Проєкт Xcode для XcodeGen (https://github.com/yonaskolb/XcodeGen). Файл GrafikSvitla.xcodeproj не зберігаємо:
# на GitHub Actions його створює `xcodegen generate` з цього опису (Mac для цього не потрібен).
#
# Що належить користувачу, зібрано в settings.base:
#   APP_BUNDLE_ID — Bundle ID застосунку (віджет — APP_BUNDLE_ID.widgets); має збігатися з App ID у Apple Developer;
#   APP_GROUP_ID  — App Group, спільне сховище застосунку й віджета;
#   DEVELOPMENT_TEAM — Team ID; на CI береться з секрету APPLE_TEAM_ID.
# MARKETING_VERSION — версія для людей (1.0.0); номер збірки CI ставить сам (номер запуску workflow).
name: GrafikSvitla
options:
  bundleIdPrefix: ua.maiak
  deploymentTarget:
    iOS: "17.0" # кнопки у віджеті (App Intents) є лише з iOS 17
  developmentLanguage: uk
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    APP_BUNDLE_ID: ua.maiak.grafik
    APP_GROUP_ID: group.ua.maiak.grafik
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1" # лише iPhone
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SvitloCore:
    path: SvitloCore
targets:
  GrafikSvitla:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: SvitloCore
      - target: GrafikWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Графік світла
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        ITSAppUsesNonExemptEncryption: false # лише HTTPS: окремої декларації про шифрування не треба
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - fetch # фонове оновлення графіка й сповіщень (BGAppRefreshTask)
        BGTaskSchedulerPermittedIdentifiers:
          - $(APP_BUNDLE_ID).refresh
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes:
              - grafiksvitla # дотик до віджета відкриває його сторінку: grafiksvitla://light, grafiksvitla://alert
    entitlements:
      path: App/GrafikSvitla.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: GrafikSvitla
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GrafikWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    dependencies:
      - package: SvitloCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Графік світла
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/GrafikWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        PRODUCT_NAME: GrafikWidgets
        SKIP_INSTALL: YES
  # Тести на симуляторі: малюють усі розміри й вигляди віджета в PNG (артефакт workflow), щоб побачити їх без Mac.
  # Логіку перевіряють тести пакета SvitloCore (swift test).
  GrafikSvitlaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: GrafikSvitla
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
schemes:
  GrafikSvitla:
    build:
      targets:
        GrafikSvitla: all
        GrafikWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GrafikSvitlaTests
    archive:
      config: Release
